<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi TV Station - Listados y Favoritos</title>
  <style>
    /* ====== presets de tamaño del monitor ====== */
    :root { --player-max: 1280px; }
    .size-s { --player-max: 700px; }
    .size-m { --player-max: 960px; }
    .size-l { --player-max: 1280px; }
    .size-xl{ --player-max: 1600px; }

    /* ====== TECH BLUE THEME ====== */
    :root{
      --bg0:#020512;
      --bg1:#050a1f;
      --panel:#070d24;
      --panel2:#0b1430;
      --line:rgba(79,155,255,.24);
      --text:#eaf2ff;

      --tech:#1f8bff;     /* Tech Blue */
      --tech2:#4ac3ff;    /* brillo */
      --glow: rgba(31,139,255,.35);
      --glow2: rgba(74,195,255,.24);
    }

    @keyframes pulse {
      0%{transform:scale(1);opacity:.9}
      50%{transform:scale(1.05);opacity:1}
      100%{transform:scale(1);opacity:.9}
    }

    body{
      background:
        radial-gradient(1100px 600px at 15% 0%, rgba(31,139,255,.18), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(74,195,255,.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), #01020a);
      color:var(--text);
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      margin:0;
      display:flex;
      justify-content:center;
      padding-top:60px;
    }

    header{
      position:fixed;
      top:0;left:0;right:0;
      height:60px;
      background:linear-gradient(180deg, rgba(7,13,36,.96), rgba(5,10,31,.92));
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      z-index:1100;
      box-shadow:0 10px 25px rgba(0,0,0,.35);
    }

    .titulo-app{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:1.25rem;
      color:var(--tech2);
      font-weight:800;
      text-shadow:0 0 10px rgba(74,195,255,.55);
      margin:0;
      letter-spacing:.2px;
    }

    .mano-animada{
      width:28px;height:28px;
      animation:moverManoIzq 1s infinite alternate;
      transform:scaleX(-1);
      filter: drop-shadow(0 0 10px rgba(74,195,255,.35));
    }

    @keyframes moverManoIzq{
      0%{transform:scaleX(-1) translateX(0)}
      100%{transform:scaleX(-1) translateX(8px)}
    }

    #openMenuBtn{font-size:28px;cursor:pointer;color:var(--tech2)}

    .container{
      max-width:1600px;
      width:100%;
      padding:20px;
      box-sizing:border-box;
      margin-top:60px;
    }

    /* ====== Menú lateral ====== */
    #menuSlider{
      position:fixed;
      top:0;left:-270px;
      width:270px;height:100%;
      background:linear-gradient(180deg, rgba(7,13,36,.98), rgba(3,7,20,.98));
      transition:left .28s ease-in-out;
      z-index:1000;
      padding:20px 15px;
      border-right:2px solid rgba(31,139,255,.55);
      box-shadow: 8px 0 22px rgba(0,0,0,.45);
      overflow-y:auto;
    }
    #menuSlider.open{left:0;}

    .menu-item{
      display:flex;
      width:100%;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      color:#cfe7ff;
      padding:12px 14px;
      font-size:16px;
      border-radius:12px;
      margin-bottom:10px;
      background:linear-gradient(180deg, rgba(31,139,255,.12), rgba(31,139,255,.06));
      border:1px solid rgba(79,155,255,.24);
      cursor:pointer;
      transition:transform .2s, box-shadow .2s, border-color .2s;
    }
    .menu-item:hover{
      transform: translateY(-1px);
      border-color: rgba(74,195,255,.45);
      box-shadow:0 0 18px rgba(31,139,255,.16);
    }

    .submenu{
      display:none;
      padding:10px 10px 12px;
      background:linear-gradient(180deg, rgba(11,20,48,.65), rgba(7,13,36,.45));
      margin-bottom:15px;
      border:1px solid rgba(79,155,255,.20);
      border-radius:14px;
    }
    .submenu-button{
      width:100%;
      text-align:left;
      font-size:14px;
      margin:8px 0;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(79,155,255,.18);
      color:#cfe7ff;
      cursor:pointer;
      padding:10px 10px;
      border-radius:12px;
    }
    .submenu-button:hover{
      border-color: rgba(74,195,255,.45);
      box-shadow:0 0 18px rgba(31,139,255,.14);
    }

    /* ====== Favoritos SLIDER (abajo en la página) ====== */
    #favorites-slider{
      display:flex;
      overflow-x:auto;
      gap:15px;
      padding:10px;
      background:linear-gradient(180deg, rgba(11,20,48,.55), rgba(7,13,36,.35));
      border-radius:14px;
      max-width:100%;
      border:1px solid rgba(79,155,255,.22);
      box-shadow:inset 0 0 20px rgba(31,139,255,.06);
      justify-content:center;
    }
    .favorite-item{
      position:relative;
      min-width:180px;
      background:linear-gradient(180deg, rgba(31,139,255,.12), rgba(0,0,0,.10));
      padding:10px;
      border-radius:14px;
      text-align:center;
      transition:transform .25s ease-in-out;
      border:1px solid rgba(79,155,255,.22);
      box-shadow:0 10px 22px rgba(0,0,0,.25);
    }
    .favorite-item img{
      width:100%;
      height:auto;
      border-radius:12px;
      margin-bottom:5px;
      transition:opacity .25s;
    }
    .favorite-item:hover{transform:scale(1.06);}
    .favorite-item:hover img{opacity:.85;}
    .channel-name{
      font-size:15px;
      font-weight:800;
      color:#fff;
      margin-top:10px;
      text-shadow:0 0 10px rgba(31,139,255,.25);
    }
    .hover-content{
      position:absolute;
      top:0;left:0;
      width:100%;height:100%;
      background:rgba(31,139,255,.12);
      display:flex;
      justify-content:center;
      align-items:center;
      opacity:0;
      transition:opacity .25s;
      border-radius:14px;
    }
    .favorite-item:hover .hover-content{opacity:1;}
    .hover-content button{
      padding:8px 12px;
      background:linear-gradient(180deg, rgba(74,195,255,.95), rgba(31,139,255,.92));
      border:none;
      color:#021018;
      font-weight:900;
      cursor:pointer;
      border-radius:999px;
      box-shadow:0 0 18px rgba(31,139,255,.28);
    }

    /* ====== Favoritos dentro del MENU (lista pro) ====== */
    #favorites-menu-list{
      margin-top:8px;
      display:grid;
      gap:8px;
      max-height:46vh;
      overflow:auto;
      padding-right:4px;
    }
    .favrow{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(79,155,255,.22);
      background:linear-gradient(180deg, rgba(31,139,255,.10), rgba(0,0,0,.10));
    }
    .favrow .ico{
      width:38px;height:38px;
      border-radius:12px;
      overflow:hidden;
      flex:0 0 auto;
      border:1px solid rgba(74,195,255,.22);
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .favrow .ico img{ width:100%; height:100%; object-fit:cover; display:block; }
    .favrow .txt{ flex:1; min-width:0; }
    .favrow .t{
      font-weight:800;
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .favrow .s{
      font-size:12px;
      opacity:.75;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .favrow .act{ display:flex; gap:6px; }
    .favbtn{
      border:none;
      border-radius:999px;
      padding:7px 10px;
      cursor:pointer;
      font-weight:800;
      background:rgba(17,24,39,.85);
      color:#eaf2ff;
      border:1px solid rgba(79,155,255,.22);
    }
    .favbtn:hover{
      border-color: rgba(74,195,255,.45);
      box-shadow:0 0 16px rgba(31,139,255,.14);
    }
    .favbtn.play{
      background:linear-gradient(180deg, rgba(74,195,255,.95), rgba(31,139,255,.92));
      color:#021018;
      border:none;
      box-shadow:0 0 18px rgba(31,139,255,.25);
    }

    /* ====== MONITOR ====== */
    .player-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      margin:20px auto 0;
    }
    .player-media{
      width:min(100%,var(--player-max));
      aspect-ratio:16/9;
      height:auto;
      border-radius:16px;
      border:2px solid rgba(31,139,255,.65);
      background:#000;
      box-shadow:0 0 18px rgba(31,139,255,.25);
      display:block;
    }

    .favorite-star{
      font-size:30px;
      color:gold;
      cursor:pointer;
      margin-top:15px;
      text-align:center;
      display:block;
      text-shadow:0 0 10px gold;
    }

    input[type="file"],select,button{
      display:flex;
      margin:10px 5px;
      padding:10px;
      border-radius:12px;
      border:1px solid rgba(79,155,255,.22);
      background:linear-gradient(180deg, rgba(31,139,255,.10), rgba(0,0,0,.10));
      color:#fff;
    }
    button:hover{border-color: rgba(74,195,255,.55); box-shadow:0 0 18px rgba(31,139,255,.12);}

    h3{text-align:center;margin-top:30px;color:var(--tech2);text-shadow:0 0 12px rgba(74,195,255,.25);}

    #category-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .category-item{
      background:linear-gradient(180deg, rgba(31,139,255,.08), rgba(0,0,0,.10));
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(79,155,255,.18);
    }

    /* ====== botones tamaño ====== */
    .size-toolbar{
      display:flex;
      gap:6px;
      align-items:center;
    }
    .size-btn{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(79,155,255,.22);
      background:rgba(17,24,39,.78);
      color:#cfe7ff;
      cursor:pointer;
      user-select:none;
    }
    .size-btn.active{
      background:linear-gradient(180deg, rgba(74,195,255,.95), rgba(31,139,255,.92));
      color:#021018;
      font-weight:900;
      border:none;
      box-shadow:0 0 18px rgba(31,139,255,.22);
    }

    /* ====== PANEL STICKY ====== */
    .sticky-panel{
      position:sticky;
      top:70px;
      z-index:900;
      margin-bottom:18px;
      border-radius:18px;
      padding:10px 14px 16px;
      background:linear-gradient(180deg, rgba(11,20,48,.92), rgba(7,13,36,.85));
      box-shadow:0 16px 30px rgba(0,0,0,.75);
      border:1px solid rgba(79,155,255,.22);
      transition: transform .25s ease, opacity .25s ease;
      transform-origin: top center;
    }
    .sticky-panel-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .sticky-panel-title{
      margin:0;
      color:var(--tech2);
      font-size:0.95rem;
      letter-spacing:.05em;
      text-transform:uppercase;
      opacity:.95;
    }
    .sticky-panel-sub{
      margin:0;
      font-size:0.78rem;
      color:#9ca3af;
    }
    #buscador{
      flex:1;
      padding:8px 10px;
      border-radius:999px;
      background:rgba(17,24,39,.85);
      color:var(--tech2);
      border:1px solid rgba(74,195,255,.55);
      font-size:0.9rem;
      outline:none;
      box-shadow:0 0 18px rgba(31,139,255,.10);
    }

    /* ====== CARRUSEL (3 tarjetas) ====== */
    .carousel-hero{
      margin-top:6px;
      max-width:100%;
      background:radial-gradient(circle at top, rgba(31,139,255,.16), rgba(2,6,23,.92));
      border-radius:14px;
      padding:10px 10px 12px;
      border:1px solid rgba(79,155,255,.18);
      box-shadow:0 0 18px rgba(31,139,255,.14);
      transition: transform .25s ease, opacity .25s ease;
      transform-origin: top center;
    }
    .carousel-row{ display:flex; gap:10px; align-items:stretch; }
    .carousel-card{
      flex:1 1 0;
      display:flex;
      flex-direction:column;
      background:rgba(15,23,42,.95);
      border-radius:14px;
      padding:8px;
      box-shadow:0 10px 18px rgba(0,0,0,.7);
      border:1px solid rgba(79,155,255,.22);
      overflow:hidden;
    }

    .carousel-card-imgwrap{
      width:100%;
      aspect-ratio: 16 / 9;
      border-radius:12px;
      overflow:hidden;
      margin-bottom:6px;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(79,155,255,.18);
    }
    .carousel-card-img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .carousel-tag{
      display:inline-flex;
      align-items:center;
      gap:4px;
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:.06em;
      background:rgba(31,139,255,.12);
      border:1px solid rgba(74,195,255,.35);
      border-radius:999px;
      padding:2px 7px;
      color:#cfe7ff;
      margin-bottom:3px;
    }
    .carousel-title{
      margin:0 0 2px;
      font-size:0.9rem;
      color:#eaf2ff;
      text-shadow:0 0 10px rgba(31,139,255,.20);
    }
    .carousel-meta{ margin:0 0 4px; font-size:0.76rem; color:#b7c4d7; }
    .carousel-actions{ margin-top:auto; display:flex; flex-wrap:wrap; gap:6px; }
    .carousel-btn{
      border:none;
      border-radius:999px;
      padding:6px 10px;
      font-size:0.75rem;
      cursor:pointer;
      font-weight:900;
      display:inline-flex;
      align-items:center;
      gap:4px;
    }
    .carousel-btn.primary{
      background:linear-gradient(180deg, rgba(74,195,255,.95), rgba(31,139,255,.92));
      color:#021018;
      box-shadow:0 0 14px rgba(31,139,255,.25);
    }
    .carousel-btn.secondary{
      background:rgba(17,24,39,.88);
      color:#eaf2ff;
      border:1px solid rgba(79,155,255,.22);
    }
    .carousel-controls{
      margin-top:8px;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:0.8rem;
      color:#9ca3af;
    }
    .carousel-mini-btn{
      border:none;
      border-radius:999px;
      padding:6px 10px;
      background:rgba(17,24,39,.88);
      color:#e5e7eb;
      cursor:pointer;
      font-size:0.75rem;
      border:1px solid rgba(79,155,255,.20);
    }
    .carousel-mini-btn:hover{border-color: rgba(74,195,255,.45); box-shadow:0 0 16px rgba(31,139,255,.12);}
    .carousel-indicator{ flex:1; text-align:center; font-variant-numeric:tabular-nums; }

    /* ====== Resultados de búsqueda flotantes ====== */
    .search-results{
      position:fixed;
      top:110px;
      left:50%;
      transform:translateX(-50%);
      width:min(100% - 40px, 1200px);
      max-height:180px;
      overflow-y:auto;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      padding:6px 10px;
      border-radius:14px;
      background:rgba(15,23,42,0.95);
      border:1px solid rgba(79,155,255,.22);
      box-shadow:0 18px 30px rgba(0,0,0,.7);
      z-index:1200;
      pointer-events:auto;
    }
    .search-result-item{
      background:rgba(17,24,39,.88);
      border-radius:999px;
      padding:6px 10px;
      font-size:0.78rem;
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid rgba(79,155,255,.20);
      cursor:pointer;
      color:#eaf2ff;
      max-width:100%;
    }
    .search-result-item:hover{border-color: rgba(74,195,255,.45); box-shadow:0 0 16px rgba(31,139,255,.10);}
    .search-result-item span{
      max-width:190px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .search-result-play{ font-size:0.8rem; opacity:.85; color: var(--tech2); }
    .search-results-empty{
      font-size:0.78rem;
      color:#9ca3af;
      opacity:.9;
      padding:2px 0 0 2px;
      width:100%;
    }

    /* ====== MODO PRO: cuando hay reproducción, el carrusel se encoge ====== */
    body.is-playing .sticky-panel{ transform: scale(.84); opacity:.92; }
    body.is-playing .carousel-hero{ transform: scale(.84); opacity:.92; }

    /* ====== MODO CINE: oculta carrusel + resultados ====== */
    body.cinema-mode .sticky-panel{ display:none !important; }
    body.cinema-mode #search-results{ display:none !important; }

    /* Botón cine activo */
    #cinemaBtn.active{
      background:linear-gradient(180deg, rgba(74,195,255,.95), rgba(31,139,255,.92));
      color:#021018;
      font-weight:900;
      border:none;
      box-shadow:0 0 18px rgba(31,139,255,.22);
    }

    @media (max-width:900px){
      .carousel-row{flex-direction:column;}
      .carousel-title{font-size:0.85rem;}
      .sticky-panel{top:64px;}
      #buscador{font-size:0.85rem;}
      .search-result-item span{max-width:150px;}
      .search-results{ top:112px; width:calc(100% - 24px); }
      body.is-playing .sticky-panel,
      body.is-playing .carousel-hero{ transform: scale(.92); }
    }

    /* ============================================================
       ✅ NUEVO: POSTERS GRANDES en el menú lateral (modo grid 2 col)
       - Solo afecta a submenus que detectamos como "películas/series"
       ============================================================ */
    .submenu.poster-grid{
      display:none; /* se controla con JS igual que los otros */
      padding:10px 10px 12px;
    }
    /* cuando el submenu está visible, el JS lo pone display:block,
       así que aquí convertimos ese "block" en grid automáticamente */
    .submenu.poster-grid[style*="display: block"]{
      display:grid !important;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 12px;
    } 
 
   /* ====== POSTERS GRANDES (mejor texto + botones visibles) ====== */
.submenu.poster-grid[style*="display: block"]{
  display:grid !important;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap:12px;                 /* un poco más de aire */
}

/* tarjeta */
.poster-tile{
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* poster más alto para que se vea pro */
.poster-tile img{
  width:100%;
  height:220px;             /* antes 180px */
  object-fit:cover;
  background:#000;
}

/* título: 2 líneas, no 1 */
.poster-tile .ptitle{
  padding:10px 12px 8px;
  font-weight:900;
  font-size:13px;           /* un poquito más grande */
  line-height:1.25;
  white-space:normal;       /* ✅ permite 2 líneas */
  overflow:hidden;
  display:-webkit-box;      /* ✅ clamp 2 líneas */
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

/* botones: más altos + texto completo */
.poster-tile .pactions{
  display:flex;
  gap:10px;
  padding:0 12px 12px;
  margin-top:auto;
}

.poster-tile .pbtn{
  flex:1;
  padding:10px 12px;        /* más alto */ 
  font-weight:900;
  font-size:12px;
  line-height:1.1;
  white-space:nowrap;       /* que no se parta raro */
  overflow:hidden;
  text-overflow:ellipsis;   /* si no cabe, ... */
}

/* si quieres que SIEMPRE se vea completo el texto del botón: */
.poster-tile .pbtn{ text-overflow:clip; } /* <- opcional */

  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <h1 class="titulo-app">
      <svg class="mano-animada" xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24">
        <path d="M13.172 11H4a1 1 0 000 2h9.172l-3.586 3.586a1 1 0 101.414 1.414l5.293-5.293a1 1 0 000-1.414l-5.293-5.293a1 1 0 00-1.414 1.414L13.172 11z"/>
      </svg>
      Mi TV Station
    </h1>

    <div class="size-toolbar">
      <button id="cinemaBtn" class="size-btn" type="button" title="Modo Cine (oculta carrusel y deja el monitor limpio)">
        🎬 Cine
      </button>

      <button class="size-btn" data-size="s">S</button>
      <button class="size-btn" data-size="m">M</button>
      <button class="size-btn" data-size="l">L</button>
      <button class="size-btn" data-size="xl">XL</button>

      <div id="openMenuBtn" onclick="toggleMenu()" title="Menú" style="margin-left:8px;font-size:28px;cursor:pointer;color:var(--tech2)">&#9776;</div>
    </div>
  </header>

  <div class="container">
    <!-- Menú lateral -->
    <div id="menuSlider">
      <h3>MENU</h3>

      <button class="menu-item" onclick="toggleSubMenu('favorites')">⭐ Favoritos</button>
      <div id="submenu-favorites" class="submenu">
        <button class="submenu-button" onclick="showFavorites(); renderFavoritesInMenu();">Ver Favoritos (slider)</button>

        <div style="display:flex; gap:8px; margin-top:10px;">
          <input id="favSearch" type="text" placeholder="🔍 Buscar favorito..."
                 style="flex:1; padding:10px; border-radius:999px; border:1px solid rgba(79,155,255,.22);
                        background:rgba(17,24,39,.85); color:#eaf2ff; outline:none;">
          <select id="favSort"
                  style="width:130px; padding:10px; border-radius:999px; border:1px solid rgba(79,155,255,.22);
                         background:rgba(17,24,39,.85); color:#eaf2ff;">
            <option value="recent">Recientes</option>
            <option value="az">A → Z</option>
          </select>
        </div>

        <div id="favorites-menu-list"></div>
      </div>

      <button class="menu-item" onclick="toggleSubMenu('channels')">📡 Canales</button>
      <div id="submenu-channels" class="submenu">
        <div id="category-list"></div>
      </div>

      <button class="menu-item" onclick="toggleSubMenu('settings')">⚙️ Configuraciones</button>
      <div id="submenu-settings" class="submenu">
        <button class="submenu-button" onclick="regenerarCanalesInternos()">Regenerar Canales VOD Internos</button>
        <button class="submenu-button" onclick="verCanalesInternos()">Ver Canales Internos</button>

        <label class="submenu-button" style="display:flex;gap:8px;align-items:center;cursor:pointer;">
          <input type="checkbox" id="askEveryTimeToggle" />
          <span>Siempre preguntar antes de abrir en ventana emergente</span>
        </label>

        <button class="submenu-button" onclick="resetExternPrefs()">Borrar preferencias de ventana emergente</button>
      </div>
    </div>

    <!-- Contenido principal -->
    <div>
      <input type="file" id="fileInput" accept=".json,.m3u">

      <!-- PANEL STICKY: buscador + carrusel -->
      <div class="sticky-panel">
        <div class="sticky-panel-header">
          <div>
            <p class="sticky-panel-title">Explorar series y canales</p>
            <p class="sticky-panel-sub">Busca un nombre o deja que el carrusel sugiera S1 · Cap 1 y canales clave.</p>
          </div>
          <input type="text" id="buscador" placeholder="🔍 Buscar canal o serie..." oninput="filtrarCanales()">
        </div>

        <div id="hero-carousel" class="carousel-hero"></div>
      </div>

      <!-- Resultados flotantes -->
      <div id="search-results" class="search-results"></div>

      <div>
        <label for="channel-select">Canales:</label>
        <select id="channel-select" onchange="playSelectedChannel()"></select>
        <img id="channel-logo" style="width:100px;height:auto;margin-top:10px;border-radius:10px;display:none;border:1px solid rgba(79,155,255,.22);" />
        <button onclick="addToFavorites()">Agregar a Favoritos</button>
        <button onclick="showFavorites(); renderFavoritesInMenu();">Ver Favoritos</button>
      </div>

      <!-- IFRAME -->
      <div class="player-wrap">
        <iframe id="iframePlayer" class="player-media" style="display:none;"
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                referrerpolicy="no-referrer" loading="lazy"></iframe>
      </div>

      <!-- Acciones iframe -->
      <div id="iframeActions" style="display:none;text-align:center;margin-top:10px;">
        <button id="openExternBtn" style="padding:10px 14px;border:none;border-radius:999px;background:linear-gradient(180deg, rgba(74,195,255,.95), rgba(31,139,255,.92));color:#021018;font-weight:900;cursor:pointer;">
          🔗 Abrir en pestaña nueva
        </button>
        <div id="iframeBlockedNote" style="margin-top:8px;color:#aab3c2;font-size:13px;display:none;">
          ⚠️ Este sitio podría bloquear el embebido en iframe. Usa el botón para abrirlo aparte.
        </div>
        <div id="externPrefsRow" style="margin-top:10px;display:flex;gap:10px;align-items:center;justify-content:center;">
          <label style="display:flex;gap:8px;align-items:center;cursor:pointer;">
            <input type="checkbox" id="alwaysExternToggle" />
            <span>Siempre abrir de este dominio <strong id="domainName" style="opacity:.8;"></strong></span>
          </label>
        </div>
      </div>

      <!-- Video principal -->
      <div class="player-wrap">
        <video id="videoPlayer" class="player-media" controls autoplay muted playsinline
               poster="https://via.placeholder.com/1280x720?text=Cargando+video">
          Tu navegador no soporta la reproducción de video en vivo.
        </video>
      </div>

      <h3>📡 Canales precargados desde update.m3u:</h3>
      <div id="contenedor-autocanales" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;"></div>
      <div id="favorites-slider"></div>
      <div class="favorite-star" onclick="addToFavorites()">★</div>
    </div>
  </div>

  <script>
    /* ====== PRO: modo reproducción (encoge carrusel) ====== */
    function setPlayingMode(on){
      document.body.classList.toggle('is-playing', !!on);
    }

    /* ====== Tamaños ====== */
    function applySize(sz){
      document.documentElement.classList.remove('size-s','size-m','size-l','size-xl');
      document.documentElement.classList.add('size-' + sz);
      localStorage.setItem('playerSize', sz);

      document.querySelectorAll('.size-btn[data-size]').forEach(function(b){
        b.classList.toggle('active', b.dataset.size === sz);
      });
    }

    (function setupSizeSelector(){
      var saved = localStorage.getItem('playerSize') || 'l';
      applySize(saved);

      document.querySelectorAll('.size-btn[data-size]').forEach(function(b){
        b.addEventListener('click', function(){
          if(document.body.classList.contains('cinema-mode')) return;
          applySize(b.dataset.size);
        });
      });
    })();

    /* ====== CINEMA MODE: XL automático + restaurar tamaño anterior ====== */
    function setCinemaMode(on){
      var btn = document.getElementById('cinemaBtn');
      document.body.classList.toggle('cinema-mode', !!on);
      if(btn) btn.classList.toggle('active', !!on);

      try{ localStorage.setItem('mtv_cinema_mode', JSON.stringify(!!on)); }catch(e){}

      if(on){
        var current = (localStorage.getItem('playerSize') || 'l');
        try{ localStorage.setItem('mtv_prev_size', current); }catch(e){}
        applySize('xl');
      }else{
        var prev = 'l';
        try{
          prev = localStorage.getItem('mtv_prev_size') || (localStorage.getItem('playerSize') || 'l');
        }catch(e){}
        applySize(prev);
      }
    }

    (function setupCinemaButton(){
      var btn = document.getElementById('cinemaBtn');
      if(!btn) return;

      btn.addEventListener('click', function(){
        setCinemaMode(!document.body.classList.contains('cinema-mode'));
      });

      try{
        var raw = localStorage.getItem('mtv_cinema_mode');
        if(raw !== null){
          var on = JSON.parse(raw);
          if(on) setCinemaMode(true);
        }
      }catch(e){}
    })();

    /* ====== Datos ====== */
    let favorites = [];
    let categories = {};
    let internalDatabase = [];
    let channelsData = [];

    let carouselList = [];
    let carouselIndex = 0;
    let carouselInterval = null;
    let carouselIsPlaying = true;

    function toggleMenu(){
      document.getElementById('menuSlider').classList.toggle('open');
    }

    function normalizeCategory(title){
      if(!title) return "sin_categoria";
      return title.trim().toLowerCase().split(" ")[0];
    }
    function isHls(url){ return /\.m3u8(\?|#|$)/i.test(url); }
    function isDirectMedia(url){ return /\.(mp4|m4v|mov|webm|ogg)(\?|#|$)/i.test(url); }
    function isHttpPage(url){
      try{
        var u=new URL(url);
        return (u.protocol === 'http:' || u.protocol === 'https:') && !isHls(url) && !isDirectMedia(url);
      }catch(e){ return false; }
    }
    function escapeHtml(str){
      return String(str || '').replace(/[&<>"']/g, function(m){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);
      });
    }

    function isFirstEpisodeOrNonEpisode(title){
      var t = String(title || '').toLowerCase();
      var hasMarkers =
        /temporada|season|\bs[0-9]{1,2}\b|\bt[0-9]{1,2}\b|episodio|cap[ií]tulo|\bep\b|\bs[0-9]{1,2}e[0-9]{1,2}\b/.test(t);

      var sxe = t.match(/s0*([0-9]{1,2})\s*e0*([0-9]{1,2})/);
      if(sxe){
        var s = parseInt(sxe[1],10);
        var e = parseInt(sxe[2],10);
        if(s === 1 && e === 1) return true;
      }

      var isSeason1 = /temporada\s*1|season\s*1|\bt1\b|\bs1\b/.test(t);
      var isEpisode1 = /episodio\s*1|cap[ií]tulo\s*1|\bcap\s*1\b|\bep\s*1\b|\be01\b/.test(t);

      if(isSeason1 && isEpisode1) return true;

      if(isSeason1 && !/episodio\s*[2-9]|cap[ií]tulo\s*[2-9]|\bep\s*[2-9]\b|\bs0*1e0*[2-9]/.test(t)){
        return true;
      }

      if(hasMarkers) return false;
      return true;
    }

    /* ====== Preferencias iframe/extern ====== */
    let externPrefs = {};
    try{ externPrefs = JSON.parse(localStorage.getItem('externDomainPrefs') || '{}') || {}; }catch(e){ externPrefs = {}; }

    function getHost(url){ try{ return new URL(url).host; }catch(e){ return ''; } }
    function shouldOpenExtern(host){ return !!externPrefs[host]; }
    function setHostPreference(host,val){
      if(!host) return;
      if(val) externPrefs[host]=true; else delete externPrefs[host];
      localStorage.setItem('externDomainPrefs', JSON.stringify(externPrefs));
    }

    let alwaysAskExtern = true;
    try{
      var rawAsk = localStorage.getItem('alwaysAskExtern');
      if(rawAsk !== null) alwaysAskExtern = JSON.parse(rawAsk);
    }catch(e){ alwaysAskExtern = true; }

    function setAlwaysAskExtern(val){
      alwaysAskExtern = !!val;
      localStorage.setItem('alwaysAskExtern', JSON.stringify(alwaysAskExtern));
    }

    function resetExternPrefs(){
      externPrefs = {};
      localStorage.removeItem('externDomainPrefs');
      alert('✅ Preferencias de ventana emergente borradas. Volverá a preguntar por cada dominio.');
    }

    function initAskEveryTimeUI(){
      var t = document.getElementById('askEveryTimeToggle');
      if(!t) return;
      t.checked = !!alwaysAskExtern;
      t.onchange = function(e){ setAlwaysAskExtern(e.target.checked); };
    }

    function setOpenExtern(url, show, blocked){
      var box=document.getElementById('iframeActions');
      var btn=document.getElementById('openExternBtn');
      var note=document.getElementById('iframeBlockedNote');
      if(!box||!btn||!note) return;
      if(show){
        box.style.display='block';
        btn.onclick=function(){ window.open(url,'_blank','noopener,noreferrer'); };
        note.style.display=blocked?'block':'none';
      }else{
        box.style.display='none';
        note.style.display='none';
        btn.onclick=null;
      }
    }

    function setupExternUIFor(url, blocked){
      if(blocked === undefined) blocked = false;
      var host=getHost(url);
      var toggle=document.getElementById('alwaysExternToggle');
      var labelDomain=document.getElementById('domainName');
      if(labelDomain) labelDomain.textContent = host ? '(' + host + ')' : '';
      if(toggle){
        toggle.checked=shouldOpenExtern(host);
        toggle.onchange=function(e){ setHostPreference(host,e.target.checked); };
      }
      setOpenExtern(url,true,blocked);
    }

    /* ====== Favoritos persistentes + timestamp ====== */
    const FAV_KEY = 'mtv_favorites_v1';
    function stampFavorite(ch){
      if(!ch) return ch;
      if(!ch.__addedAt) ch.__addedAt = Date.now();
      return ch;
    }
    function saveFavorites(){
      try{
        favorites = (favorites || []).map(stampFavorite);
        localStorage.setItem(FAV_KEY, JSON.stringify(favorites || []));
      }catch(e){}
    }
    function loadFavorites(){
      try{
        const raw = localStorage.getItem(FAV_KEY);
        if(raw){ favorites = (JSON.parse(raw) || []).map(stampFavorite); }
      }catch(e){ favorites = []; }
    }
    function ensureThumb(ch){
      if(!ch.thumbnail){
        ch.thumbnail = 'https://via.placeholder.com/320x180?text=' + encodeURIComponent(ch.title || 'Canal');
      }
    }

    /* ====== Parser M3U ====== */
    function parseM3U(content){
      var lines = content.split('\n');
      var channels = [];
      var currentTitle = '';
      var currentLogo = '';

      lines.forEach(function(line,i){
        line=line.trim();
        if(line.startsWith('#EXTINF')){
          var titleMatch=line.match(/,(.*)$/);
          currentTitle=titleMatch?titleMatch[1].trim():'Canal ' + i;
          var logoMatch=line.match(/tvg-logo="(.*?)"/i);
          currentLogo=logoMatch?logoMatch[1]:'';
        }else if(line && !line.startsWith('#')){
          channels.push({
            title: currentTitle || ('Canal ' + (channels.length+1)),
            url: line,
            thumbnail: currentLogo
          });
          currentTitle='';
          currentLogo='';
        }
      });
      return channels;
    }

    function shuffleArray(arr){
      for(var i = arr.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    /* ====== Carrusel ====== */
    function setupCarousel(){
      var box = document.getElementById('hero-carousel');
      if(!box) return;

      carouselList = channelsData.filter(function(ch){ return isFirstEpisodeOrNonEpisode(ch.title); });
      if(carouselList.length === 0) carouselList = channelsData.slice();

      if(carouselList.length === 0){
        box.innerHTML = '<p style="text-align:center;color:#aab3c2;margin:4px 0;">Carga una lista para ver el carrusel ✨</p>';
        stopCarouselAuto();
        return;
      }

      shuffleArray(carouselList);
      carouselIndex = 0;
      renderCarouselSlide();
      startCarouselAuto();
    }

    function renderCarouselSlide(){
      var box = document.getElementById('hero-carousel');
      if(!box || carouselList.length === 0) return;

      var visible = Math.min(3, carouselList.length);
      var cardsHtml = '';
      var i, idx, ch, thumb, cat;

      for(i=0; i<visible; i++){
        idx = (carouselIndex + i) % carouselList.length;
        ch = carouselList[idx];
        thumb = ch.thumbnail || ('https://via.placeholder.com/480x270?text=' + encodeURIComponent(ch.title));
        cat = ch.category || normalizeCategory(ch.title);

        cardsHtml +=
          '<div class="carousel-card">' +
            '<div class="carousel-card-imgwrap">' +
              '<img src="' + thumb + '" alt="' + escapeHtml(ch.title) + '" class="carousel-card-img">' +
            '</div>' +
            '<div class="carousel-tag">Serie / Canal sugerido</div>' +
            '<h2 class="carousel-title">' + escapeHtml(ch.title) + '</h2>' +
            '<p class="carousel-meta">Categoría: <strong>' + escapeHtml(cat) + '</strong></p>' +
            '<div class="carousel-actions">' +
              '<button class="carousel-btn primary" onclick="playFromCarousel(' + idx + ')">▶ Reproducir</button>' +
              '<button class="carousel-btn secondary" onclick="addToFavoritesFromCarousel(' + idx + ')">★ Favorito</button>' +
            '</div>' +
          '</div>';
      }

      box.innerHTML =
        '<div class="carousel-row">' + cardsHtml + '</div>' +
        '<div class="carousel-controls">' +
          '<button class="carousel-mini-btn" onclick="prevCarousel()">◀</button>' +
          '<span class="carousel-indicator">' + (carouselIndex + 1) + ' / ' + carouselList.length + '</span>' +
          '<button class="carousel-mini-btn" onclick="nextCarousel()">▶</button>' +
          '<button class="carousel-mini-btn" onclick="toggleCarouselAuto()">' +
            (carouselIsPlaying ? '⏸ Auto' : '▶ Auto') +
          '</button>' +
        '</div>';
    }

    function startCarouselAuto(){
      stopCarouselAuto();
      if(carouselList.length <= 1) return;
      carouselIsPlaying = true;
      carouselInterval = setInterval(function(){
        carouselIndex = (carouselIndex + 1) % carouselList.length;
        renderCarouselSlide();
      }, 10000);
    }
    function stopCarouselAuto(){
      if(carouselInterval){ clearInterval(carouselInterval); carouselInterval = null; }
    }
    function nextCarousel(){
      if(carouselList.length === 0) return;
      carouselIndex = (carouselIndex + 1) % carouselList.length;
      renderCarouselSlide();
      if(carouselIsPlaying) startCarouselAuto();
    }
    function prevCarousel(){
      if(carouselList.length === 0) return;
      carouselIndex = (carouselIndex - 1 + carouselList.length) % carouselList.length;
      renderCarouselSlide();
      if(carouselIsPlaying) startCarouselAuto();
    }
    function toggleCarouselAuto(){
      carouselIsPlaying = !carouselIsPlaying;
      if(carouselIsPlaying) startCarouselAuto(); else stopCarouselAuto();
      renderCarouselSlide();
    }

    function playFromCarousel(idx){
      var ch = carouselList[idx];
      if(ch && ch.url) playChannel(ch.url);
    }
    function addToFavoritesFromCarousel(idx){
      var ch = carouselList[idx];
      if(!ch) return;
      ensureThumb(ch);
      favorites.push(stampFavorite(ch));
      saveFavorites();
      renderFavoritesInMenu();
      alert('Agregado a favoritos: ' + ch.title);
    }

    /* ============================================================
       ✅ NUEVO: Heurística para detectar "poster" (pelis/series)
       ============================================================ */
    function isPosterItem(ch){
      var thumb = String((ch && ch.thumbnail) || '');
      var url = String((ch && ch.url) || '');
      // señales típicas de poster o thumbnails grandes
      var looksPosterThumb = /w500|poster|tmdb|360x|500x|600x|image\.tmdb\.org/i.test(thumb);
      // si NO es stream HLS ni media directa, suele ser algo tipo película/serie link
      var looksNotChannel = (!/\.m3u8(\?|#|$)/i.test(url) && !/\.(mp4|m4v|mov|webm|ogg)(\?|#|$)/i.test(url));
      // si el thumb existe pero no es típico de logo horizontal
      return !!(looksPosterThumb || (thumb && looksNotChannel));
    }

    /* ====== Cargar canales + categorías ====== */
    function loadChannels(){
      categories = {};
      channelsData.forEach(function(channel,index){
        var title = channel.title || channel.name || channel.nombre || ('Canal ' + (index+1));
        channel.title = title.trim();
        if(!channel.thumbnail){
          channel.thumbnail = 'https://via.placeholder.com/320x180?text=' + encodeURIComponent(channel.title);
        }
        var category = normalizeCategory(channel.title);
        channel.category = category;
        if(!categories[category]) categories[category]=[];
        categories[category].push(channel);
      });
      renderCategories();
      loadChannelDropdown();
      renderAutoCargados();
      setupCarousel();
      filtrarCanales();
      renderFavoritesInMenu();
    }

    function renderCategories(){
      var categoryList = document.getElementById('category-list');
      categoryList.innerHTML = '';

      for (var category in categories) {
        if(!categories.hasOwnProperty(category)) continue;
        var items = categories[category];
        if (!items || items.length === 0) continue;

        var wrapper = document.createElement('div');
        wrapper.className = 'category-item';

        var btn = document.createElement('button');
        btn.className = 'submenu-button';
        btn.textContent = category + ' (' + items.length + ' canal(es))';
        btn.addEventListener('click', (function(cat){
          return function(){ toggleSubMenu(cat); };
        })(category));

        var submenu = document.createElement('div');
        submenu.id = 'submenu-' + category;
        submenu.className = 'submenu';

        // ✅ Detectar si este grupo es mayoritariamente posters (películas/series)
        var posterCount = 0;
        for(var pi=0; pi<items.length; pi++){
          if(isPosterItem(items[pi])) posterCount++;
        }
        var isPosterGrid = (posterCount / Math.max(1, items.length)) >= 0.6;

        if(isPosterGrid){
          submenu.classList.add('poster-grid');
        }

        items.forEach(function(ch){
          // ====== MODO GRID (películas/series) ======
          if(isPosterGrid){
            var tile = document.createElement('div');
            tile.className = 'poster-tile';

            var img = document.createElement('img');
            img.src = ch.thumbnail || ('https://via.placeholder.com/480x720?text=' + encodeURIComponent(ch.title));
            img.alt = ch.title || '';

            var title = document.createElement('div');
            title.className = 'ptitle';
            title.textContent = ch.title || 'Título';

            var actions = document.createElement('div');
            actions.className = 'pactions';

            var playBtn = document.createElement('button');
            playBtn.className = 'pbtn play';
            playBtn.textContent = '▶ Play';
            playBtn.addEventListener('click', function(){ playChannel(ch.url); });

            var fav = document.createElement('button');
            fav.className = 'pbtn';
            fav.textContent = '★ Fav';
            fav.addEventListener('click', function(){ addToFavoritesFromSubMenu(ch.title, ch.url); });

            actions.appendChild(playBtn);
            actions.appendChild(fav);

            tile.appendChild(img);
            tile.appendChild(title);
            tile.appendChild(actions);

            submenu.appendChild(tile);
            return;
          }

          // ====== MODO LISTA (canales / logos) ======
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;margin-bottom:10px;';

          var img2 = document.createElement('img');
          var thumb2 = ch.thumbnail || ('https://via.placeholder.com/200x120?text=' + encodeURIComponent(ch.title));
          img2.src = thumb2;
          img2.alt = ch.title || '';
          // ✅ aquí dejamos logos “grandes” como ya lo tenías (horizontal)
          img2.style.cssText = 'width:78px;height:52px;object-fit:contain;margin-right:10px;border-radius:12px;border:1px solid rgba(79,155,255,.18);background:#000;';

          var right = document.createElement('div');
          right.style.flexGrow = '1';

          var playBtn2 = document.createElement('button');
          playBtn2.textContent = '▶ ' + ch.title;
          playBtn2.style.cssText = 'margin-bottom:5px;font-size:13px;';
          playBtn2.addEventListener('click', function(){ playChannel(ch.url); });

          var br = document.createElement('br');

          var fav2 = document.createElement('button');
          fav2.textContent = '+ Favorito';
          fav2.style.cssText = 'font-size:12px;';
          fav2.addEventListener('click', function(){ addToFavoritesFromSubMenu(ch.title, ch.url); });

          right.appendChild(playBtn2);
          right.appendChild(br);
          right.appendChild(fav2);

          row.appendChild(img2);
          row.appendChild(right);
          submenu.appendChild(row);
        });

        wrapper.appendChild(btn);
        wrapper.appendChild(submenu);
        categoryList.appendChild(wrapper);
      }
    }

    function toggleSubMenu(id){
      var el=document.getElementById('submenu-' + id);
      if(!el) return;
      var next = (el.style.display==='block' ? 'none' : 'block');
      el.style.display = next;

      if(id === 'favorites' && next === 'block'){
        bindFavControls();
        renderFavoritesInMenu();
      }
    }

    function loadChannelDropdown(){
      var sel=document.getElementById('channel-select');
      var logo=document.getElementById('channel-logo');
      sel.innerHTML='';
      channelsData.forEach(function(ch,i){
        var opt=document.createElement('option');
        opt.value=i;
        opt.textContent=ch.title;
        sel.appendChild(opt);
      });
      if(channelsData[0] && channelsData[0].thumbnail){
        logo.src=channelsData[0].thumbnail;
        logo.style.display='block';
      } else {
        logo.style.display='none';
      }
    }

    function renderAutoCargados(){
      var cont=document.getElementById('contenedor-autocanales');
      cont.innerHTML='';
      channelsData.forEach(function(ch){
        var card=document.createElement('div');
        card.style.cssText='width:180px;border-radius:14px;padding:10px;text-align:center;border:1px solid rgba(79,155,255,.18);background:linear-gradient(180deg, rgba(31,139,255,.10), rgba(0,0,0,.10));box-shadow:0 10px 18px rgba(0,0,0,.25)';
        var img=document.createElement('img');
        img.src= ch.thumbnail || ('https://via.placeholder.com/320x180?text=' + encodeURIComponent(ch.title));
        img.style.cssText='width:100%;border-radius:12px;margin-bottom:8px;background:#000;border:1px solid rgba(79,155,255,.16)';
        var name=document.createElement('div');
        name.textContent=ch.title;
        name.style.cssText='color:#fff;font-size:13px;margin-bottom:8px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
        var btn=document.createElement('button');
        btn.textContent='▶️ Play';
        btn.style.cssText='border:none;padding:7px 10px;border-radius:999px;cursor:pointer;font-weight:900;background:linear-gradient(180deg, rgba(74,195,255,.95), rgba(31,139,255,.92));color:#021018;box-shadow:0 0 14px rgba(31,139,255,.22)';
        btn.onclick=function(){ playChannel(ch.url); };
        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(btn);
        cont.appendChild(card);
      });
    }

    /* ====== Favoritos: agregar + ver ====== */
    function addToFavorites(){
      var sel = document.getElementById('channel-select');
      var idx = sel.value;
      if(idx !== ''){
        var ch = channelsData[parseInt(idx,10)];
        if(!ch) return;
        ensureThumb(ch);
        favorites.push(stampFavorite(ch));
        saveFavorites();
        renderFavoritesInMenu();
        alert('Agregado a favoritos: ' + ch.title);
      }
    }

    function addToFavoritesFromSubMenu(title,url){
      var ch = channelsData.find(function(c){ return c.title===title && c.url===url; });
      if(ch){
        ensureThumb(ch);
        favorites.push(stampFavorite(ch));
        saveFavorites();
        renderFavoritesInMenu();
        alert('Agregado a favoritos: ' + ch.title);
      }
    }

    function showFavorites(){
      var slider=document.getElementById('favorites-slider');
      slider.innerHTML='';
      favorites.forEach(function(ch){
        var card=document.createElement('div');
        card.className='favorite-item';

        var preview=document.createElement('div');
        preview.style.width='320px';
        preview.style.height='180px';
        preview.style.borderRadius='12px';
        preview.style.overflow='hidden';
        preview.style.display='flex';
        preview.style.justifyContent='center';
        preview.style.alignItems='center';
        preview.style.background='#000';
        preview.style.border='1px solid rgba(79,155,255,.18)';

        if(ch.thumbnail){
          var img=document.createElement('img');
          img.src=ch.thumbnail;
          img.alt=ch.title;
          img.style.maxWidth='100%';
          img.style.maxHeight='100%';
          img.style.objectFit='contain';
          img.style.borderRadius='12px';
          preview.appendChild(img);
        }else{
          preview.style.background='linear-gradient(180deg, rgba(74,195,255,.95), rgba(31,139,255,.92))';
          preview.style.color='#021018';
          preview.style.fontWeight='900';
          preview.style.fontSize='18px';
          preview.style.animation='pulse 2s infinite';
          preview.textContent=ch.title;
        }

        var name=document.createElement('div');
        name.className='channel-name';
        name.textContent=ch.title;

        var hover=document.createElement('div');
        hover.className='hover-content';
        var playBtn=document.createElement('button');
        playBtn.textContent='▶ Play';
        playBtn.addEventListener('click',function(){ playChannel(ch.url); });
        hover.appendChild(playBtn);

        card.appendChild(preview);
        card.appendChild(name);
        card.appendChild(hover);
        slider.appendChild(card);
      });
    }

    /* ====== Favoritos dentro del menu: buscar + ordenar ====== */
    function bindFavControls(){
      var s = document.getElementById('favSearch');
      var o = document.getElementById('favSort');
      if(s) s.oninput = renderFavoritesInMenu;
      if(o) o.onchange = renderFavoritesInMenu;
    }
    function getFavQuery(){
      var inp = document.getElementById('favSearch');
      return inp ? (inp.value || '').toLowerCase().trim() : '';
    }
    function getFavSort(){
      var sel = document.getElementById('favSort');
      return sel ? sel.value : 'recent';
    }

    function renderFavoritesInMenu(){
      var box = document.getElementById('favorites-menu-list');
      if(!box) return;

      var q = getFavQuery();
      var sort = getFavSort();

      var list = (favorites || []).slice().map(stampFavorite);

      if(q){
        list = list.filter(function(ch){
          var t = String(ch.title || '').toLowerCase();
          var u = String(ch.url || '').toLowerCase();
          return t.includes(q) || u.includes(q);
        });
      }

      if(sort === 'az'){
        list.sort(function(a,b){
          return String(a.title||'').localeCompare(String(b.title||''), 'es');
        });
      }else{
        list.sort(function(a,b){ return (b.__addedAt||0) - (a.__addedAt||0); });
      }

      if(list.length === 0){
        box.innerHTML = '<div class="search-results-empty" style="padding:6px 2px;">No hay favoritos que coincidan.</div>';
        return;
      }

      box.innerHTML = '';
      list.forEach(function(ch){
        var row = document.createElement('div');
        row.className = 'favrow';

        var ico = document.createElement('div');
        ico.className = 'ico';
        if(ch.thumbnail){
          var img = document.createElement('img');
          img.src = ch.thumbnail;
          img.alt = ch.title || '';
          ico.appendChild(img);
        }else{
          ico.textContent = '📺';
          ico.style.color = 'var(--tech2)';
        }

        var txt = document.createElement('div');
        txt.className = 'txt';
        var t = document.createElement('div');
        t.className = 't';
        t.textContent = ch.title || 'Favorito';
        var s = document.createElement('div');
        s.className = 's';
        s.textContent = (getHost(ch.url) || '').trim() || (ch.url || '').slice(0,28);
        txt.appendChild(t); txt.appendChild(s);

        var act = document.createElement('div');
        act.className = 'act';

        var p = document.createElement('button');
        p.className = 'favbtn play';
        p.textContent = '▶';
        p.title = 'Reproducir';
        p.onclick = function(){ playChannel(ch.url); };

        var d = document.createElement('button');
        d.className = 'favbtn';
        d.textContent = '🗑️';
        d.title = 'Eliminar';

        d.onclick = function(){
          favorites = favorites.filter(function(x){
            return !(x && x.url===ch.url && x.title===ch.title && (x.__addedAt||0)===(ch.__addedAt||0));
          });
          if(favorites.some(function(x){ return x && x.url===ch.url && x.title===ch.title; })){
            favorites = favorites.filter(function(x){ return !(x && x.url===ch.url && x.title===ch.title); });
          }
          saveFavorites();
          renderFavoritesInMenu();
          showFavorites();
        };

        act.appendChild(p); act.appendChild(d);
        row.appendChild(ico); row.appendChild(txt); row.appendChild(act);
        box.appendChild(row);
      });
    }

    /* ====== Reproducción ====== */
    function playChannel(url){
      setPlayingMode(true);

      var video=document.getElementById('videoPlayer');
      var iframe=document.getElementById('iframePlayer');

      if(window.hls){
        try{window.hls.destroy();}catch(e){}
        window.hls=null;
      }

      if(isHls(url)){
        iframe.style.display='none';
        iframe.src='about:blank';
        setOpenExtern(url,false);
        if(Hls.isSupported()){
          var hls=new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
          window.hls=hls;
        } else if(video.canPlayType('application/vnd.apple.mpegurl')){
          video.src=url;
        } else {
          alert('Este navegador no soporta HLS');
        }
        video.style.display='block';
        video.play().catch(function(){});
        return;
      }

      if(isDirectMedia(url)){
        iframe.style.display='none';
        iframe.src='about:blank';
        setOpenExtern(url,false);
        video.src=url;
        video.style.display='block';
        video.play().catch(function(){});
        return;
      }

      if(isHttpPage(url)){
        var host = getHost(url);

        if(shouldOpenExtern(host) && alwaysAskExtern){
          var resp = confirm(
            'Este dominio (' + host + ') está marcado para abrir SIEMPRE en ventana emergente.\n\n' +
            '¿Quieres abrir en ventana emergente esta vez?\n\n' +
            'Aceptar = Abrir emergente\nCancelar = Intentar abrir aquí (iframe)'
          );
          if(resp){
            window.open(url,'_blank','noopener,noreferrer');
            iframe.style.display='none';
            iframe.src='about:blank';
            setOpenExtern(url,false);
            video.pause();
            video.style.display='none';
            video.removeAttribute('src');
            return;
          }
        } else if(shouldOpenExtern(host) && !alwaysAskExtern){
          window.open(url,'_blank','noopener,noreferrer');
          iframe.style.display='none';
          iframe.src='about:blank';
          setOpenExtern(url,false);
          video.pause();
          video.style.display='none';
          video.removeAttribute('src');
          return;
        }

        video.pause();
        video.style.display='none';
        video.removeAttribute('src');
        iframe.style.display='block';
        iframe.src=url;
        setupExternUIFor(url,false);

        setTimeout(function(){
          var blocked=false;
          try{
            var doc=iframe.contentDocument;
            blocked=!doc;
          }catch(e){
            blocked=true;
          }
          if(blocked){
            setupExternUIFor(url,true);
            if(!shouldOpenExtern(host)){
              var ok = confirm(
                'Parece que ' + host + ' bloquea el iframe.\n' +
                '¿Quieres abrir SIEMPRE este dominio en pestaña nueva a partir de ahora?'
              );
              if(ok){
                setHostPreference(host,true);
                window.open(url,'_blank','noopener,noreferrer');
              }
            }
          }
        },1200);
        return;
      }

      alert('Tipo de enlace no reconocido. Abriendo en nueva pestaña…');
      window.open(url,'_blank','noopener,noreferrer');
    }

    function playSelectedChannel(){
      var sel=document.getElementById('channel-select');
      var idx=sel.value;
      var logo=document.getElementById('channel-logo');
      if(idx === '') return;
      var ch=channelsData[parseInt(idx,10)];
      if(ch && ch.url){
        playChannel(ch.url);
        if(ch.thumbnail){
          logo.src=ch.thumbnail;
          logo.style.display='block';
        } else {
          logo.style.display='none';
        }
      }
    }

    /* ====== Búsqueda ====== */
    function filtrarCanales(){
      var buscador = document.getElementById('buscador');
      var q = buscador ? buscador.value.toLowerCase() : '';
      var sel = document.getElementById('channel-select');
      var resultsBox = document.getElementById('search-results');

      sel.innerHTML = '';
      if(resultsBox) resultsBox.innerHTML = '';

      var matches = [];

      channelsData.forEach(function(ch,i){
        if(ch.title.toLowerCase().includes(q)){
          var opt=document.createElement('option');
          opt.value=i;
          opt.textContent=ch.title;
          sel.appendChild(opt);
          matches.push({ ch: ch, index: i });
        }
      });

      if(resultsBox){
        if(!q) return;

        if(matches.length === 0){
          var empty = document.createElement('div');
          empty.className = 'search-results-empty';
          empty.textContent = 'Sin resultados para esta búsqueda.';
          resultsBox.appendChild(empty);
          return;
        }

        var maxToShow = 20;
        for(var j=0; j<matches.length && j<maxToShow; j++){
          var m = matches[j];
          var item = document.createElement('div');
          item.className = 'search-result-item';

          var playSpan = document.createElement('span');
          playSpan.className = 'search-result-play';
          playSpan.textContent = '▶';

          var titleSpan = document.createElement('span');
          titleSpan.textContent = m.ch.title;

          item.appendChild(playSpan);
          item.appendChild(titleSpan);
          item.addEventListener('click',(function(idxLocal){
            return function(){
              sel.value = String(idxLocal);
              var chLocal = channelsData[idxLocal];
              if(chLocal) playChannel(chLocal.url);
            };
          })(m.index));

          resultsBox.appendChild(item);
        }

        if(matches.length > maxToShow){
          var extra = document.createElement('div');
          extra.className = 'search-results-empty';
          extra.textContent = '+' + (matches.length - maxToShow) + ' resultados más… usa el listado de canales.';
          resultsBox.appendChild(extra);
        }
      }
    }

    /* ====== File input ====== */
    document.getElementById('fileInput').addEventListener('change',function(e){
      var file=e.target.files[0];
      if(!file) return;
      var reader=new FileReader();
      reader.onload=function(ev){
        var content=ev.target.result.trim();
        var name=file.name.toLowerCase();

        if(name.endsWith('.json')){
          try{
            var parsed=JSON.parse(content);
            if(Array.isArray(parsed)) channelsData=parsed;
            else if(parsed.channels && Array.isArray(parsed.channels)) channelsData=parsed.channels;
            else if(parsed.lista && Array.isArray(parsed.lista)) channelsData=parsed.lista;
            else { alert('Formato de JSON no reconocido.'); return; }
            loadChannels();
          }catch(err){
            alert('❌ Error al leer el archivo JSON');
          }
        }else if(name.endsWith('.m3u')){
          try{
            channelsData=parseM3U(content);
            loadChannels();
          }catch(err){
            alert('❌ Error al procesar el archivo M3U');
          }
        }else{
          alert('❌ Tipo de archivo no soportado. Usa .json o .m3u');
        }
      };
      reader.readAsText(file);
    });

    /* ====== Internos ====== */
    function regenerarCanalesInternos(){
      if(!confirm('¿Estás seguro que deseas borrar y regenerar los 1000 canales internos?')) return;
      var generated=[];
      for(var i=0;i<1000;i++){
        generated.push({
          name:'Canal ' + (i+1),
          title:'VOD Canal ' + (i+1),
          url:'https://vod.mycamtv.net/' + (i+1) + '.m3u8',
          category:'VOD Categoria ' + ((i%10)+1),
          thumbnail:'https://via.placeholder.com/320x180?text=VOD+' + (i+1)
        });
      }
      localStorage.setItem('internalDatabase', JSON.stringify(generated));
      internalDatabase=generated;
      channelsData=generated.slice();
      loadChannels();
      alert('✅ Canales VOD regenerados.');
    }

    function verCanalesInternos(){
      if(!internalDatabase || internalDatabase.length===0){
        alert('⚠ No hay canales internos cargados. Primero regénéralos.');
        return;
      }
      channelsData=internalDatabase.slice();
      loadChannels();
      alert('✅ Mostrando canales internos VOD.');
    }

    /* ====== Init ====== */
    window.addEventListener('DOMContentLoaded',function(){
      initAskEveryTimeUI();

      // favoritos persistidos
      loadFavorites();
      bindFavControls();
      renderFavoritesInMenu();
      showFavorites();

      // si termina el video, quitamos el modo playing
      var video = document.getElementById('videoPlayer');
      if(video){
        video.addEventListener('ended', function(){ setPlayingMode(false); });
      }

      // auto-load update3.m3u
      fetch('update3.m3u')
        .then(function(res){ return res.text(); })
        .then(function(text){
          if(text.indexOf('#EXTM3U') !== -1){
            channelsData=parseM3U(text);
            loadChannels();
          }else{
            console.warn('⚠ El archivo no parece ser un M3U válido');
          }
        })
        .catch(function(err){
          console.warn('❌ No se pudo cargar update3.m3u:',err);
        });
    });
  </script>
